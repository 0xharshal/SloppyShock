[versions]
agp = "9.4.1"
kotlin = "2.3.21"
watchfacePush = "1.0.0"
wearCompose = "1.6.1"
activityCompose = "1.13.0"
lifecycle = "2.10.0"

[libraries]
watchface-validator-cli = { module = "com.google.android.wearable.watchface.validator:validator-push-cli", version = "1.1.0-alpha01" }
watchface-push = { module = "androidx.wear.watchfacepush:watchfacepush", version.ref = "watchfacePush" }
wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wearCompose" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearCompose" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
