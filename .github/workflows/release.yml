# Builds signed release APKs of all watch faces for a version tag (v*) and
# publishes them as a GitHub Release.
#
# Required repository secrets:
#   SIGNING_KEYSTORE_BASE64   base64 of the release keystore (.jks)
#   SIGNING_STORE_PASSWORD    keystore password
#   SIGNING_KEY_ALIAS         key alias
#   SIGNING_KEY_PASSWORD      key password
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0"

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 is not set"; exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APKs
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # versionCode must grow with every release; offset keeps it above local builds.
          ./gradlew :watchface:assembleRelease \
            -PversionName="$VERSION" -PversionCode=$((GITHUB_RUN_NUMBER + 100))
          mkdir dist
          cp watchface/build/outputs/apk/compact/release/watchface-compact-release.apk   "dist/SloppyShock-$VERSION.apk"
          cp watchface/build/outputs/apk/detailed/release/watchface-detailed-release.apk "dist/SloppyShock-Detailed-$VERSION.apk"
          cp watchface/build/outputs/apk/dual/release/watchface-dual-release.apk         "dist/SloppyShock-Dual-$VERSION.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
