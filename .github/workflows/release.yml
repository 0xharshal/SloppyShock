# Builds the signed SloppyShock watch app (all faces bundled) for a version tag
# (v*) and publishes it as a GitHub Release.
#
# Required repository secrets (Watch Face Push wants faces signed with a key
# different from the app's):
#   SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
#   FACE_SIGNING_KEYSTORE_BASE64, FACE_SIGNING_STORE_PASSWORD, FACE_SIGNING_KEY_ALIAS, FACE_SIGNING_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0"

      - name: Decode signing keystores
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          FACE_SIGNING_KEYSTORE_BASE64: ${{ secrets.FACE_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ] || [ -z "$FACE_SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are not set"; exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/app.jks"
          echo "$FACE_SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/faces.jks"

      - name: Build release APK
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/app.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          FACE_SIGNING_KEYSTORE: ${{ runner.temp }}/faces.jks
          FACE_SIGNING_STORE_PASSWORD: ${{ secrets.FACE_SIGNING_STORE_PASSWORD }}
          FACE_SIGNING_KEY_ALIAS: ${{ secrets.FACE_SIGNING_KEY_ALIAS }}
          FACE_SIGNING_KEY_PASSWORD: ${{ secrets.FACE_SIGNING_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # versionCode must grow with every release; offset keeps it above local builds.
          ./gradlew :app:assembleRelease \
            -PversionName="$VERSION" -PversionCode=$((GITHUB_RUN_NUMBER + 100))
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/SloppyShock-$VERSION.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
